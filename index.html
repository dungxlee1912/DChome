<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#1b2433;--mut:#6b768a;--ln:#e3e8f1;--acc:#c8102e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1420;--card:#192031;--tx:#e8edf7;--mut:#93a0b8;--ln:#2a3550}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1420;--card:#192031;--tx:#e8edf7;--mut:#93a0b8;--ln:#2a3550}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;max-width:1100px;margin:auto}
h1{margin:0;font-size:21px}.sub{color:var(--mut);font-size:13px;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;max-width:1100px;margin:auto}
.tab{flex:0 0 auto;border-radius:12px;padding:6px 12px;border:2px solid var(--ln);background:var(--card);text-align:center;font-size:12px;color:var(--mut)}
.tab b{display:block;font-size:15px;color:var(--tx)}.tab.sel{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
main{max-width:1100px;margin:auto;padding:8px 16px 40px;display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}.wx{order:-1}}
.wx{position:sticky;top:8px;background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.wx h3{margin:0;padding:10px 14px;color:#fff;background:var(--c);font-size:14px}
.wx .w{padding:12px 14px;border-top:1px solid var(--ln)}.wx .t{font-size:26px;font-weight:700}.wx small{color:var(--mut);display:block}
.wx a{color:var(--acc);font-size:13px}
.it{display:grid;grid-template-columns:minmax(92px,112px) 1fr;gap:10px;background:var(--card);border:1px solid var(--ln);border-left:6px solid var(--c);border-radius:12px;padding:10px 12px;margin-bottom:10px;position:relative}
.it.flight{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,var(--card)),var(--card))}
.tm{font-weight:700;font-size:13px;color:var(--c)}.loc{font-size:11px;color:var(--mut);margin-top:2px}
.ti{font-weight:600}.dt,.mv,.nt{font-size:13px;color:var(--mut);white-space:pre-line;margin-top:3px}
.mv::before{content:"🚆 "}.nt::before{content:"💡 "}.flight .mv::before{content:"✈️ "}
.edit [contenteditable]{outline:1px dashed var(--ln);border-radius:4px;min-height:1em;padding:0 2px}
.edit [contenteditable]:empty::before{content:attr(data-ph);color:var(--mut)}
.tp{display:flex;flex-direction:column;gap:3px}.tp input{width:100%;font:inherit;font-size:13px;font-weight:700;color:var(--c);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:2px 4px}
.ctl{display:none;gap:4px;margin-top:6px}.edit .ctl{display:flex}.ctl button{padding:2px 8px;font-size:12px}
.mv:empty,.dt:empty,.nt:empty{display:none}.edit .mv:empty,.edit .dt:empty,.edit .nt:empty{display:block}
.dayh{font-size:17px;font-weight:700;margin:0 0 10px}
</style></head><body>
